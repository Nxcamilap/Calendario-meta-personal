<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de Metas</title>
<style>
  :root{
    --color-primario: #E49AB0;
    --color-primario-oscuro: #C97690;
    --color-secundario: #ECCFC3;
    --color-fondo: #FFFFFF;
    --color-texto: #3B2A30;
    --color-texto-suave: #A47B87;
    --color-exito: #4CAF82;
    --color-error: #D6555E;
    --sombra-suave: 0 10px 30px rgba(196,120,148,0.18);
    --sombra-fuerte: 0 14px 34px rgba(196,120,148,0.4);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:'Trebuchet MS', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    color:var(--color-texto);
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.55), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(150deg, var(--color-secundario) 0%, var(--color-primario) 100%);
    background-attachment:fixed;
    padding:2.5rem 1rem;
    display:flex;
    justify-content:center;
  }

  /* ---------- Tarjeta principal: el calendario vive sobre fondo blanco ---------- */
  .tarjeta{
    background:var(--color-fondo);
    width:100%;
    max-width:500px;
    border-radius:28px;
    padding:2rem 1.7rem 1.8rem;
    box-shadow:var(--sombra-suave);
    position:relative;
    overflow:hidden;
  }

  .tarjeta::before{
    content:'';
    position:absolute;
    top:-70px; right:-70px;
    width:160px; height:160px;
    background:radial-gradient(circle, var(--color-secundario) 0%, transparent 70%);
    opacity:0.9;
    pointer-events:none;
  }

  /* ---------- Título de marca, centrado, antes del mes ---------- */
  .marca{ text-align:center; margin-bottom:1.6rem; position:relative; }

  .marca h1{
    font-size:1.5rem;
    font-weight:800;
    color:var(--color-primario-oscuro);
    letter-spacing:0.01em;
  }

  .marca .adorno{ color:var(--color-primario); font-size:1.1rem; margin:0 0.4rem; }

  .marca .linea{
    width:52px; height:3px;
    margin:0.5rem auto 0;
    border-radius:999px;
    background:linear-gradient(90deg, var(--color-secundario), var(--color-primario), var(--color-secundario));
  }

  /* ---------- Cabecera del mes ---------- */
  .cabecera{ display:flex; align-items:center; justify-content:space-between; margin-bottom:0.2rem; }

  .cabecera h2{
    font-size:clamp(1.3rem, 6vw, 1.7rem);
    font-weight:700;
    color:var(--color-texto);
    text-transform:capitalize;
  }

  .subtitulo{ color:var(--color-texto-suave); font-size:0.85rem; margin-bottom:1.6rem; }

  .nav-mes{ display:flex; gap:0.5rem; }

  .btn-nav{
    width:36px; height:36px;
    border:none;
    border-radius:50%;
    background:var(--color-secundario);
    color:var(--color-primario-oscuro);
    font-size:1.15rem;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-nav:hover{ background:var(--color-primario); color:#fff; transform:translateY(-2px); box-shadow:var(--sombra-suave); }

  /* ---------- Encabezado de días de la semana ---------- */
  .dias-semana{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    color:var(--color-texto-suave);
    font-size:0.72rem;
    font-weight:700;
    margin-bottom:0.6rem;
  }

  /* ---------- Cuadrícula ---------- */
  .cuadricula{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }

  .celda-vacia{ visibility:hidden; }

  .dia{
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    background:var(--color-secundario);
    opacity:0.55;
    border-radius:10px;
    border:2px solid transparent;
    transition:transform 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
  }

  .dia.clicable{ cursor:pointer; opacity:1; }
  .dia.clicable:hover{ transform:translateY(-2px) scale(1.04); border-color:var(--color-primario); box-shadow:var(--sombra-suave); }
  .dia.futuro{ color:var(--color-texto-suave); }
  .dia.hoy{ border-color:var(--color-primario-oscuro); }

  .numero-dia{ font-size:0.82rem; font-weight:600; }
  .indicador{ font-size:1.05rem; line-height:1; margin-top:2px; }
  .indicador.exito{ color:var(--color-exito); }
  .indicador.error{ color:var(--color-error); }

  /* ---------- Leyenda ---------- */
  .leyenda{ display:flex; gap:1.3rem; margin-top:1.5rem; font-size:0.78rem; color:var(--color-texto-suave); justify-content:center; }
  .leyenda span{ display:flex; align-items:center; gap:0.35rem; }

  /* ---------- Modal ---------- */
  .fondo-modal{
    display:none;
    position:fixed; inset:0;
    background:rgba(59,42,48,0.5);
    align-items:center;
    justify-content:center;
    padding:1rem;
    z-index:10;
  }
  .fondo-modal.activo{ display:flex; }

  .modal{
    background:var(--color-fondo);
    width:100%;
    max-width:400px;
    border-radius:26px;
    padding:1.8rem;
    box-shadow:var(--sombra-fuerte);
    max-height:90vh;
    overflow-y:auto;
  }

  .modal h3{ font-size:1.2rem; color:var(--color-primario-oscuro); margin-bottom:1.2rem; text-transform:capitalize; }

  .campo{ margin-bottom:1.1rem; }

  .campo label{ display:block; font-size:0.8rem; font-weight:600; color:var(--color-texto-suave); margin-bottom:0.4rem; }

  .segmentado{ display:flex; border-radius:999px; background:var(--color-secundario); padding:4px; }
  .segmentado button{
    flex:1; border:none; background:transparent;
    padding:0.55rem 0.5rem; border-radius:999px;
    font-size:0.83rem; font-weight:700; color:var(--color-texto-suave);
    cursor:pointer; transition:background 0.2s ease, color 0.2s ease;
  }
  .segmentado button.activo-exito{ background:var(--color-exito); color:#fff; }
  .segmentado button.activo-error{ background:var(--color-error); color:#fff; }

  .caja-comentario{
    border:1.5px solid var(--color-secundario);
    border-radius:12px;
    padding:0.7rem 0.85rem;
    font-size:0.88rem;
    line-height:1.4;
    color:var(--color-texto);
    background:#FDF7F5;
  }
  .caja-comentario.vacio{ color:var(--color-texto-suave); font-style:italic; }

  textarea{
    width:100%;
    border:1.5px solid var(--color-secundario);
    border-radius:12px;
    padding:0.6rem 0.7rem;
    font-family:inherit;
    font-size:0.9rem;
    resize:vertical;
    color:var(--color-texto);
  }
  textarea:focus{ outline:2px solid var(--color-primario); outline-offset:1px; }

  /* Bloque de evidencia: ahora es de solo lectura, viene del código, no de una subida local.
     Admite hasta 2 imágenes por día, cada una con su propio botón para verla completa. */
  .caja-evidencia{
    display:flex;
    gap:0.6rem;
    flex-wrap:wrap;
  }

  .btn-evidencia{
    flex:1;
    min-width:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.4rem;
    border:none;
    background:var(--color-secundario);
    color:var(--color-primario-oscuro);
    padding:0.7rem 0.8rem;
    border-radius:14px;
    font-size:0.85rem;
    font-weight:700;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-evidencia:hover{ background:var(--color-primario); color:#fff; transform:translateY(-2px); box-shadow:var(--sombra-suave); }

  /* Lightbox: muestra la captura seleccionada en pantalla completa */
  .lightbox{
    display:none;
    position:fixed; inset:0;
    background:rgba(59,42,48,0.85);
    align-items:center;
    justify-content:center;
    padding:1.5rem;
    z-index:20;
    cursor:zoom-out;
  }
  .lightbox.activo{ display:flex; }

  .lightbox img{
    max-width:100%;
    max-height:90vh;
    border-radius:16px;
    box-shadow:var(--sombra-fuerte);
  }

  .sin-evidencia{
    border:1.5px dashed var(--color-secundario);
    border-radius:14px;
    padding:1.1rem;
    text-align:center;
    font-size:0.8rem;
    color:var(--color-texto-suave);
    background:#FDF7F5;
  }

  .acciones-modal{ display:flex; gap:0.6rem; margin-top:1.4rem; }

  .btn{
    flex:1; border:none; padding:0.75rem; border-radius:999px;
    font-size:0.88rem; font-weight:700; cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }

  .btn-guardar{ background:linear-gradient(135deg, var(--color-primario), var(--color-primario-oscuro)); color:#fff; }
  .btn-guardar:hover{ box-shadow:var(--sombra-fuerte); transform:translateY(-2px); }

  .btn-cerrar{ background:#F6ECE9; color:var(--color-texto-suave); }
  .btn-cerrar:hover{ background:var(--color-secundario); }

  /* ---------- Responsivo ---------- */
  @media (max-width:480px){
    body{ padding:1.4rem 0.6rem; }
    .tarjeta{ padding:1.5rem 1.1rem 1.4rem; border-radius:22px; }
    .marca h1{ font-size:1.25rem; }
    .cabecera h2{ font-size:1.35rem; }
    .cuadricula{ gap:4px; }
    .numero-dia{ font-size:0.72rem; }
    .indicador{ font-size:0.9rem; }
    .btn-nav{ width:32px; height:32px; font-size:1rem; }
    .modal{ padding:1.4rem; border-radius:20px; }
  }

  @media (max-width:340px){
    .dias-semana{ font-size:0.62rem; }
    .numero-dia{ font-size:0.65rem; }
    .indicador{ font-size:0.8rem; }
  }
</style>
</head>
<body>

<div class="tarjeta">

  <div class="marca">
    <h1><span class="adorno">✿</span>Mi Calendario de Meta<span class="adorno">✿</span></h1>
    <div class="linea"></div>
  </div>

  <div class="cabecera">
    <h2 id="tituloMes">Mes</h2>
    <div class="nav-mes">
      <button class="btn-nav" id="btnMesAnterior" aria-label="Mes anterior">‹</button>
      <button class="btn-nav" id="btnMesSiguiente" aria-label="Mes siguiente">›</button>
    </div>
  </div>
  <p class="subtitulo">Meta: Reducir tiempo de uso del celular (3h)
    <br> Inicio: Sept 09
  </p>

  <div class="dias-semana">
    <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
  </div>

  <div class="cuadricula" id="cuadriculaDias"></div>

  <div class="leyenda">
    <span><span class="indicador exito">✓</span> Cumplida</span>
    <span><span class="indicador error">✗</span> No cumplida</span>
  </div>
</div>

<!-- Modal de registro diario -->
<div class="fondo-modal" id="fondoModal">
  <div class="modal">
    <h3 id="fechaModal">Fecha</h3>

    <div class="campo">
      <label>Estado de la meta</label>
      <div class="segmentado">
        <button type="button" id="btnCumplido">Cumplido</button>
        <button type="button" id="btnNoCumplido">No cumplido</button>
      </div>
    </div>

    <div class="campo">
      <label>Evidencia del día</label>
      <div class="caja-evidencia" id="cajaEvidencia"></div>
    </div>

    <div class="campo">
      <label>Comentario</label>
      <div class="caja-comentario" id="cajaComentario"></div>
    </div>

    <div class="acciones-modal">
      <button class="btn btn-cerrar" id="btnCerrarModal">Cancelar</button>
      <button class="btn btn-guardar" id="btnGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- Lightbox: imagen completa al hacer clic en un botón de evidencia -->
<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="Captura de evidencia ampliada">
</div>

<script>
  /* =========================================================================
     IMÁGENES DE EVIDENCIA
     -------------------------------------------------------------------------
     Formato: 'YYYY-MM-DD': ['ruta imagen 1', 'ruta imagen 2']
     (si solo tienes una imagen ese día, dejar un solo elemento en el arreglo)
  ========================================================================= */
  const IMAGENES_DIAS = {
    '2026-09-09': ['img/1-sept09.jpeg', 'img/2-sept09.jpeg'],
    '2026-09-10': ['img/sept10.jpeg'],
    '2026-09-11': ['img/sept11.jpeg'],
    '2026-09-12': ['img/sept12.jpeg'],
    '2026-09-13': ['img/1-sept14.jpeg', 'img/2-sept14.jpeg'],
    '2026-09-14': ['img/1-sept14.jpeg', 'img/2-sept14.jpeg'], 
    '2026-09-15': ['img/1-sept15.jpeg', 'img/2-sept15.jpeg'], 
    '2026-09-16': ['img/1-sept16.jpeg', 'img/2-sept16.jpeg'],
    // '2026-09-17': ['img/1-sept17.jpeg', 'img/2-sept17.jpeg'],
    // '2026-09-18': ['img/1-sept18.jpeg', 'img/2-sept18.jpeg'],
    // '2026-09-19': ['img/1-sept19.jpeg', 'img/2-sept19.jpeg'],
    // '2026-09-20': ['img/1-sept20.jpeg', 'img/2-sept20.jpeg'],
    // '2026-09-21': ['img/1-sept21.jpeg', 'img/2-sept21.jpeg'],
    // '2026-09-22': ['img/1-sept22.jpeg', 'img/2-sept22.jpeg'],
    // '2026-09-23': ['img/1-sept23.jpeg', 'img/2-sept23.jpeg'],
    // '2026-09-24': ['img/1-sept24.jpeg', 'img/2-sept24.jpeg'],
    // '2026-09-25': ['img/1-sept25.jpeg', 'img/2-sept25.jpeg'],
    // '2026-09-26': ['img/1-sept26.jpeg', 'img/2-sept26.jpeg'],
    // '2026-09-27': ['img/1-sept27.jpeg', 'img/2-sept27.jpeg'],
    // '2026-09-28': ['img/1-sept28.jpeg', 'img/2-sept28.jpeg'],
    // '2026-09-29': ['img/1-sept29.jpeg', 'img/2-sept29.jpeg'],
    // '2026-09-30': ['img/1-sept30.jpeg', 'img/2-sept30.jpeg'],
  };

  /* =========================================================================
     COMENTARIOS
     -----------------------------------------------------------------------
     Formato: 'YYYY-MM-DD': 'texto del comentario'
  ========================================================================= */
  const COMENTARIOS_DIAS = {
    '2026-09-09': 'Este fue el primer dia del reto de limitar uso de celular, comencé con meta de 2 horas pero teniendo en cuenta que trabajo en marketing se complicó lograrla',

    '2026-09-10': 'Almost there jaja',

    '2026-09-11': 'en vez de reducirle, le subí un poco. Oops, I did it again.',

    '2026-09-12': 'En este día sí me excedí, compensaré el tiempo con 10 pags de lectura',

    '2026-09-13': 'En este punto la meta seguían siendo 2 horas, conseguí reducir bastante el tiempo de uso y compartí más tiempo con mi familia. Salí con mi mamá y mi pareja a jugar ping pong en el parque.',
    
    '2026-09-14': 'Aquí probé con 2h y 30mins de meta y aun así me excedí, pero seguía siendo baja la meta. Sin embargo establecí 3 horas como meta fija. Teniendo eso en cuenta, compensaré el tiempo excedente con 10 páginas de lectura',

    '2026-09-15': 'Aquí ya la meta fija de tiempo fueron 3h, estuve en su rango',

    '2026-09-16': 'Meeee pasé por 4 minutitos jaja, pero meta cumplida',

    '2026-09-17': 'text',
    '2026-09-18': 'text',
    '2026-09-19': 'text',
    '2026-09-20': 'text',
    '2026-09-21': 'text',
    '2026-09-22': 'text',
    '2026-09-23': 'text',
    '2026-09-24': 'text',
    '2026-09-25': 'text',
    '2026-09-26': 'text',
    '2026-09-27': 'text',
    '2026-09-28': 'text',
    '2026-09-29': 'text',
    '2026-09-30': 'text'
  };

  // ---------- Estado general ----------
  const NOMBRES_MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const hoy = new Date();
  let vistaAnio = hoy.getFullYear();
  let vistaMes = hoy.getMonth(); // 0-11
  let fechaSeleccionada = null;  // string ISO 'YYYY-MM-DD' del día abierto en el modal
  let estadoTemporal = null;     // true/false mientras se edita el modal

  const cuadricula = document.getElementById('cuadriculaDias');
  const tituloMes = document.getElementById('tituloMes');

  // ---------- Utilidades ----------
  function formatoISO(anio, mes, dia){
    return `${anio}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
  }

  function obtenerRegistro(fechaISO){
    const datos = localStorage.getItem('meta_' + fechaISO);
    return datos ? JSON.parse(datos) : null;
  }

  function guardarRegistroEnStorage(fechaISO, registro){
    localStorage.setItem('meta_' + fechaISO, JSON.stringify(registro));
  }

  // ---------- Renderizado del calendario ----------
  function renderizarCalendario(){
    tituloMes.textContent = `${NOMBRES_MES[vistaMes]} ${vistaAnio}`;
    cuadricula.innerHTML = '';

    const primerDiaSemana = (new Date(vistaAnio, vistaMes, 1).getDay() + 6) % 7; // 0 = lunes
    const totalDias = new Date(vistaAnio, vistaMes + 1, 0).getDate();

    for(let i=0; i<primerDiaSemana; i++){
      const vacia = document.createElement('div');
      vacia.className = 'celda-vacia';
      cuadricula.appendChild(vacia);
    }

    for(let dia=1; dia<=totalDias; dia++){
      const fechaCelda = new Date(vistaAnio, vistaMes, dia);
      fechaCelda.setHours(0,0,0,0);
      const hoySinHora = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
      const esFuturo = fechaCelda > hoySinHora;
      const esHoy = fechaCelda.getTime() === hoySinHora.getTime();
      const fechaISO = formatoISO(vistaAnio, vistaMes, dia);

      const celda = document.createElement('div');
      celda.className = 'dia' + (esFuturo ? ' futuro' : ' clicable') + (esHoy ? ' hoy' : '');

      const numero = document.createElement('span');
      numero.className = 'numero-dia';
      numero.textContent = dia;
      celda.appendChild(numero);

      if(!esFuturo){
        const registro = obtenerRegistro(fechaISO);
        const cumplido = registro ? registro.cumplido : true; // sin registro = cumplida por defecto
        const indicador = document.createElement('span');
        indicador.className = 'indicador ' + (cumplido ? 'exito' : 'error');
        indicador.textContent = cumplido ? '✓' : '✗';
        celda.appendChild(indicador);

        celda.addEventListener('click', () => abrirModal(fechaISO));
      }

      cuadricula.appendChild(celda);
    }
  }

  // ---------- Navegación entre meses ----------
  document.getElementById('btnMesAnterior').addEventListener('click', () => {
    vistaMes--;
    if(vistaMes < 0){ vistaMes = 11; vistaAnio--; }
    renderizarCalendario();
  });

  document.getElementById('btnMesSiguiente').addEventListener('click', () => {
    vistaMes++;
    if(vistaMes > 11){ vistaMes = 0; vistaAnio++; }
    renderizarCalendario();
  });

  // ---------- Modal ----------
  const fondoModal = document.getElementById('fondoModal');
  const fechaModal = document.getElementById('fechaModal');
  const btnCumplido = document.getElementById('btnCumplido');
  const btnNoCumplido = document.getElementById('btnNoCumplido');
  const cajaEvidencia = document.getElementById('cajaEvidencia');
  const cajaComentario = document.getElementById('cajaComentario');

  function abrirModal(fechaISO){
    fechaSeleccionada = fechaISO;
    const [anio, mes, dia] = fechaISO.split('-').map(Number);
    const fechaLegible = new Date(anio, mes-1, dia).toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
    fechaModal.textContent = fechaLegible;

    const registro = obtenerRegistro(fechaISO);
    estadoTemporal = registro ? registro.cumplido : true;
    const comentario = COMENTARIOS_DIAS[fechaISO];
    cajaComentario.textContent = comentario ? comentario : 'Sin comentario para este día.';
    cajaComentario.classList.toggle('vacio', !comentario);

    // La evidencia siempre viene de IMAGENES_DIAS (editado manualmente en el código)
    const imagenes = IMAGENES_DIAS[fechaISO];
    if(imagenes && imagenes.length > 0){
      cajaEvidencia.innerHTML = imagenes
        .map((ruta, i) => `<button type="button" class="btn-evidencia" data-ruta="${ruta}">🖼 Captura ${i+1}</button>`)
        .join('');
      // Cada botón abre su imagen en el lightbox
      cajaEvidencia.querySelectorAll('.btn-evidencia').forEach(boton => {
        boton.addEventListener('click', () => abrirLightbox(boton.dataset.ruta));
      });
    } else {
      cajaEvidencia.innerHTML = `<div class="sin-evidencia">Aún no se han agregado imágenes para este día</div>`;
    }

    actualizarSegmentado();
    fondoModal.classList.add('activo');
  }

  function cerrarModal(){
    fondoModal.classList.remove('activo');
    fechaSeleccionada = null;
  }

  function actualizarSegmentado(){
    btnCumplido.className = estadoTemporal ? 'activo-exito' : '';
    btnNoCumplido.className = !estadoTemporal ? 'activo-error' : '';
  }

  btnCumplido.addEventListener('click', () => { estadoTemporal = true; actualizarSegmentado(); });
  btnNoCumplido.addEventListener('click', () => { estadoTemporal = false; actualizarSegmentado(); });

  document.getElementById('btnCerrarModal').addEventListener('click', cerrarModal);
  fondoModal.addEventListener('click', (e) => { if(e.target === fondoModal) cerrarModal(); });

  // ---------- Lightbox (ver captura completa) ----------
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  function abrirLightbox(ruta){
    lightboxImg.src = ruta;
    lightbox.classList.add('activo');
  }

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('activo');
    lightboxImg.src = '';
  });

  document.getElementById('btnGuardar').addEventListener('click', () => {
    if(!fechaSeleccionada) return;
    const registro = {
      cumplido: estadoTemporal
    };
    guardarRegistroEnStorage(fechaSeleccionada, registro);
    cerrarModal();
    renderizarCalendario();
  });

  // ---------- Inicio ----------
  renderizarCalendario();
</script>
</body>
